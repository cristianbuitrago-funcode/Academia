# Integración continua de Funcode Academy.
# Se ejecuta en cada push y pull request: pruebas del dominio, pruebas JVM de la
# app (incluye Robolectric), lint y compilación del APK de depuración.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      # JDK 21: Robolectric lo exige para simular Android 15 o superior.
      # El código se sigue compilando para Java 17 (jvmTarget).
      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle (con caché y validación del wrapper)
        uses: gradle/actions/setup-gradle@v5

      - name: Pruebas de :core:domain
        run: ./gradlew :core:domain:test

      - name: Pruebas de :core:javarunner (prototipo Fase 8, JVM)
        run: ./gradlew :core:javarunner:test

      - name: Pruebas JVM de :app (Robolectric)
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Compilar APK de depuración
        run: ./gradlew :app:assembleDebug

      - name: Comprobar que el esquema de Room está guardado en Git
        run: |
          git status --porcelain app/schemas
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::El esquema de Room generado no coincide con el guardado en app/schemas. Contenido generado:"
            git diff app/schemas
            find app/schemas -name '*.json' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
            exit 1
          fi

      - name: Resumen de pruebas y lint
        if: always()
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, xml.etree.ElementTree as ET
          print("### Pruebas")
          total = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for f in sorted(glob.glob("core/domain/build/test-results/test/*.xml") + glob.glob("core/javarunner/build/test-results/test/*.xml") + glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              s = ET.parse(f).getroot()
              counts = {k: int(s.get(k, 0)) for k in total}
              for k in total:
                  total[k] += counts[k]
              print(f"- {s.get('name')}: {counts['tests']} pruebas, {counts['failures']} fallos, {counts['errors']} errores, {counts['skipped']} omitidas")
          print(f"\n**Total:** {total['tests']} pruebas, {total['failures']} fallos, {total['errors']} errores, {total['skipped']} omitidas\n")
          print("### Lint")
          for f in glob.glob("app/build/reports/lint-results-debug.sarif"):
              results = json.load(open(f))["runs"][0].get("results", [])
              levels = {}
              for r in results:
                  levels[r.get("level", "?")] = levels.get(r.get("level", "?"), 0) + 1
                  print(f"- [{r.get('level')}] {r.get('ruleId')}: {r['message']['text'][:160]}")
              print(f"\n**Total de avisos de lint:** {len(results)} {levels}")
          EOF

      - name: Publicar el APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: funcode-academy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar informes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            core/domain/build/reports/
            app/build/reports/
          if-no-files-found: ignore

  emulator:
    # Las pruebas JVM (Robolectric) no usan el Android real: algunos fallos solo
    # aparecen en un teléfono. Este job abre la app en emuladores con la versión
    # mínima admitida (API 26) y una reciente, y guarda el logcat.
    name: Emulador Android (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34]

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Activar la aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compilar el APK y las pruebas instrumentadas
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Abrir la app en el emulador y ejecutar la prueba de humo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/emulator-smoke.sh

      - name: Publicar logcat, captura e informes del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulador-api-${{ matrix.api }}
          path: |
            emulator-logcat.txt
            emulator-inicio.png
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/test-results/
          if-no-files-found: ignore

  apk-size:
    # Fase 8 (F8-D4): incremento del APK release frente a la versión base sin el
    # prototipo (commit d867bd5). APK release sin firmar y sin reducir (minify desactivado).
    name: Tamaño del APK release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código (con historial)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compilar el APK release actual
        run: ./gradlew :app:assembleRelease

      - name: Compilar el APK release base (sin el prototipo)
        run: |
          git worktree add ../base d867bd5
          cd ../base && ./gradlew :app:assembleRelease

      - name: Comparar tamaños
        run: |
          actual=$(stat -c %s app/build/outputs/apk/release/app-release-unsigned.apk)
          base=$(stat -c %s ../base/app/build/outputs/apk/release/app-release-unsigned.apk)
          diff=$((actual - base))
          {
            echo "### Tamaño del APK release (sin firmar, sin minify)"
            echo "- Base (d867bd5): $base bytes ($(echo "scale=2; $base/1048576" | bc) MB)"
            echo "- Actual: $actual bytes ($(echo "scale=2; $actual/1048576" | bc) MB)"
            echo "- Incremento: $diff bytes ($(echo "scale=2; $diff/1048576" | bc) MB); umbral F8-D4: 25 MB"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | grep -E "classes[0-9]*\.dex|funcode-stubs/index" || true

  windows:
    # Windows es el sistema de desarrollo del responsable: las pruebas JVM
    # (incluido Robolectric con SQLite nativo) deben pasar también aquí.
    # Se usan rutas con espacios (proyecto y carpeta temporal), como en un perfil
    # de usuario "C:\Users\nombre apellido", para detectar problemas de rutas.
    name: Pruebas en Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TEMP: D:\a\_temp\temporal con espacios
      TMP: D:\a\_temp\temporal con espacios
    defaults:
      run:
        working-directory: proyecto con espacios

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5
        with:
          path: proyecto con espacios

      - name: Crear la carpeta temporal con espacios
        run: New-Item -ItemType Directory -Force -Path $env:TEMP

      - name: Instalar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Pruebas de :core:domain y de :app
        run: ./gradlew.bat :core:domain:test :core:javarunner:test :app:testDebugUnitTest --rerun-tasks

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-windows
          path: |
            proyecto con espacios/core/domain/build/reports/
            proyecto con espacios/app/build/reports/
          if-no-files-found: ignore
